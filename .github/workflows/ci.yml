name: CI

# Gates the invariants this repository now relies on: formatting, a warning-free build of
# every target, and the fail-closed test suites. Deliberately small - it does not run
# clippy, benchmarks, or anything that would need a model artifact.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # candle is a heavy dependency and the build runs serially; without a bound a stuck job
    # would occupy a runner for six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # `--locked` throughout: Cargo.lock is committed precisely so a run here uses the same
      # dependency graph as a run on a workstation. Without it, CI silently resolves newer
      # versions and stops testing what anyone else builds.
      #
      # Warnings are denied per-crate through the `[lints]` table rather than with a global
      # RUSTFLAGS. A blanket deny also applies to path dependencies, so one new compiler
      # warning anywhere would fail every job, and it would fail on a toolchain upgrade rather
      # than on a change anyone made.
      - name: Build all targets
        # Serial: parallel all-target compilation has exhausted memory on smaller runners.
        run: cargo check --workspace --all-targets --locked -j 1

      - name: Library and integration tests
        run: cargo test --workspace --lib --tests --locked -j 1

      - name: Documentation tests
        run: cargo test --workspace --doc --locked -j 1

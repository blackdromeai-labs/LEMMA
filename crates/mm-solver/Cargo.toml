[package]
name = "mm-solver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Unified solver API for LEMMA"

[features]
default = []
# See the note in crates/mm-brain/Cargo.toml: candle-nn's CUDA kernels are gated behind
# candle-nn's own `cuda` feature, so it must be named explicitly here too.
cuda = ["candle-core/cuda", "candle-nn/cuda", "mm-brain/cuda"]

[dependencies]
mm-core = { path = "../mm-core" }
mm-rules = { path = "../mm-rules" }
mm-verifier = { path = "../mm-verifier" }
mm-search = { path = "../mm-search" }
mm-brain = { path = "../mm-brain" }
mm-boink = { path = "../mm-boink" }
mm-macro = { path = "../mm-macro" }
thiserror.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true

[[example]]
name = "solve_quadratic"
path = "examples/solve_quadratic.rs"

